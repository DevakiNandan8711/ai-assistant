<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Face Gradient -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base (Smooth Rounded Tile) -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" />

  <!-- Subtle Border / Highlight -->
  <rect x="5" y="5" width="118" height="118" rx="29" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

  <!-- Antenna Spark -->
  <circle cx="64" cy="24" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <line x1="64" y1="28" x2="64" y2="40" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>

  <!-- Robot Head / Outer Shell -->
  <rect x="28" y="38" width="72" height="56" rx="20" fill="url(#faceGrad)" stroke="#60a5fa" stroke-width="2.5"/>

  <!-- Robot Ears / Headphone nubs -->
  <rect x="22" y="54" width="6" height="24" rx="3" fill="#38bdf8"/>
  <rect x="100" y="54" width="6" height="24" rx="3" fill="#38bdf8"/>

  <!-- Glowing Robot Eyes -->
  <circle cx="48" cy="62" r="7" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="49" cy="61" r="2.5" fill="#ffffff"/>

  <circle cx="80" cy="62" r="7" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="81" cy="61" r="2.5" fill="#ffffff"/>

  <!-- Friendly Smile -->
  <path d="M 52 76 Q 64 85 76 76" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Circuit Sparkle Dots -->
  <circle cx="64" cy="46" r="2" fill="#c084fc"/>
  <line x1="56" y1="46" x2="72" y2="46" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="2,2"/>
</svg>
